<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Drill & Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script async src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{--bg:#000;--fg:#f2e6d0;--soil:#2a2218;--soil2:#3a2f22;--gold:#ffd21a;--grn:#6cc04a}
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;display:none;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
#hp{width:110px;height:12px;background:#3a3a3a;border:2px solid #777}
#hpf{height:100%;width:100%;background:#d94a3a}
#base{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:140px;height:140px;margin-left:-70px;border-radius:50%;background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.25);display:none}
#knob{position:absolute;left:50px;top:50px;width:40px;height:40px;border-radius:50%;background:rgba(120,200,90,.8);border:3px solid #cfe9b8}
body.play #hud{display:flex}body.play #base{display:block}
.ov,.ov *{touch-action:manipulation}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);padding:16px;text-align:center}
.card{width:100%;max-width:340px;background:var(--soil);border:2px solid var(--soil2);padding:18px;display:flex;flex-direction:column;gap:10px;max-height:92%}
h2,h3{margin:0;font-size:20px}h3{font-size:17px}p{margin:0;font-size:13px;opacity:.85}
.row{display:flex;justify-content:space-between;align-items:baseline}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px;text-align:left}
.bal span{background:var(--soil2);padding:6px 8px}
button{font:inherit;padding:11px 14px;background:var(--soil2);border:2px solid #5a4a36;color:var(--fg);cursor:pointer}
button.big{background:var(--grn);border-color:#a8e08c;color:#102008;font-weight:bold;font-size:17px;padding:14px}
button:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid button{padding:10px 4px;font-size:13px}
input{font:inherit;padding:10px;background:#15110b;border:2px solid #5a4a36;color:var(--fg);width:100%;user-select:text;-webkit-user-select:text;touch-action:auto}
.list{overflow:auto;touch-action:pan-y;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:4px}
.list div{display:flex;justify-content:space-between;gap:8px;background:var(--soil2);padding:6px 8px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:var(--gold);color:#201800;padding:8px 14px;font-size:14px;display:none;z-index:9;max-width:90%;text-align:center}
.pxi{width:18px;height:18px;vertical-align:middle;margin-right:4px}
#lbw{overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;text-align:left}
.pzg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pz{background:var(--soil2);border:2px solid #5a4a36;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pz.r1{border-color:#ffd21a}.pz.r2{border-color:#c9d1d9}.pz.r3{border-color:#cd7f32}
.pz img,.pz .ph{width:44px;height:44px;object-fit:contain;image-rendering:auto}
.pz .ph{display:flex;align-items:center;justify-content:center;font-size:26px}
.pz b{font-size:15px}.pz small{font-size:11px;opacity:.85;overflow-wrap:anywhere}
#sndbtn.off{background:#8a4a40;border-color:#b86a5a;color:#fff}
.prow{display:grid;grid-template-columns:3fr 2fr;gap:6px}.prow button{font-size:14px;padding:10px 6px}.prow .big{font-size:17px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tabs button{padding:9px 4px;font-size:14px}.tabs button.on{background:var(--grn);border-color:#a8e08c;color:#102008;font-weight:bold}
.inv{overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:6px;text-align:left}
.it{display:flex;gap:10px;align-items:center;background:var(--soil2);border:2px solid #5a4a36;padding:8px}
.it.eq{border-color:var(--gold)}
.it img,.it .ph{width:48px;height:48px;object-fit:contain;flex:none;image-rendering:auto;background:#15110b}
.it .ph{display:flex;align-items:center;justify-content:center;font-size:26px}
.it .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.it .inf b{font-size:14px;overflow-wrap:anywhere}.it .inf small{font-size:11px;opacity:.85}
.it button{padding:8px 10px;font-size:12px;flex:none}
.it button.on{background:var(--gold);border-color:#ffe680;color:#201800;font-weight:bold}
.slt{font-size:13px;color:var(--gold);margin:6px 0 0}
.tot{font-size:12px;background:var(--soil2);padding:6px 8px;text-align:left}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="hp"><div id="hpf"></div></div><span id="sc">Score 0</span><span id="cs">💵0</span><span id="sk">💠0</span><span id="gd"><img class="pxi" alt="PXN"><span id="gdv">0</span></span></div>
<div id="base"><div id="knob"></div></div>

<div id="load" class="ov" style="display:flex"><div id="lt">Loading…</div></div>

<div id="menu" class="ov"><div class="card">
  <h2>⛏ Drill & Earn</h2>
  <div class="row"><b id="en">⚡ 0/24</b><small id="nx"></small></div>
  <div class="bal"><span id="by"><img class="pxi" alt="PXN"><span id="byv">0</span></span><span id="bc">💵 0</span><span id="bb">💠 0</span></div>
  <div class="prow"><button class="big" id="pl">▶ Play (1 ⚡)</button><button id="inv">🎒 Inventory</button></div>
  <button id="adb">📺 Watch ad (+1 ⚡)</button>
  <div class="grid" style="grid-template-columns:1fr 1fr"><button id="wd">💸 Withdraw</button><button id="lb">🏆 Top 50</button></div>
  <button id="stb">⚙ Settings</button>
</div></div>

<div id="panel" class="ov"><div class="card" id="pc"></div></div>

<div id="over" class="ov"><div class="card">
  <h2>Game over</h2><p id="fin"></p>
  <button id="rb" style="display:none">Retry sending result</button>
  <button class="big" id="ob">Menu</button>
</div></div>
<div id="settings" class="ov"><div class="card"><h2>Settings</h2><button id="sndbtn" onclick="togSnd()">Sound: ON</button><button class="big" onclick="openSet(0)">Back</button></div></div>
<div id="toast"></div>

<script>
// ================= SETTINGS =================
const PROJECT_ID='vgesniwdlepqsezeerdc';        // Supabase Project ID
// Ads are configured from the admin panel (Settings: ad_provider + ad_block_id), nothing to edit here.
// ============================================
const API='https://'+PROJECT_ID+'.supabase.co/functions/v1/game';
const TG=window.Telegram&&Telegram.WebApp;if(TG){TG.ready();TG.expand();try{TG.disableVerticalSwipes()}catch(e){}}
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M={no_energy:'No energy left ⚡',ad_limit_reached:'No ads left today',ad_cooldown:'Wait a few seconds before the next ad',round_already_active:'A round is already running',banned:'This account is banned',withdraw_disabled:'Withdrawals are turned off',low_trust:'Account is under verification',account_too_new:'Account is too new. Try again later',bad_ton_address:'TON address is not valid',amount_out_of_range:'Amount is out of allowed range',daily_cap:'Daily withdraw limit reached',under_review:'Account is under review',account_restricted:'Account is restricted',init_data_expired:'Reopen the game from Telegram',bad_init_data:'Open this game from Telegram',unauthorized:'Session expired. Reopen the game',network:'Network problem. Try again',not_owned:'You do not own this item',item_inactive:'This item is not available',slot_mismatch:'Wrong slot',bad_item:'Invalid item',player_not_found:'Player not found'};
const msg=e=>{const m=e&&e.message||'error';return M[m]||(/check constraint/.test(m)?'Not enough balance':m)};
let token=null,me=null,R=null,busy=0,nextAt=0;
let AD={provider:'none',block:''},_mtLoaded='';
function dev(){let d=localStorage.getItem('dv');if(!d){d=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('dv',d)}return d}
async function api(action,data={},retry){
  let r,j;
  try{r=await fetch(API,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:JSON.stringify(Object.assign({action},data))});j=await r.json()}catch(e){throw new Error('network')}
  if(r.status===401&&action!=='auth'&&!retry){await login();return api(action,data,true)}
  if(!r.ok||j.error)throw new Error(j.error||'error');
  return j;
}
async function login(){const j=await api('auth',{initData:TG?TG.initData:'',device:dev()});token=j.token}
const adVal=v=>{v=v==null?'':String(v).trim();if(v.length>1&&v[0]==='"'&&v[v.length-1]==='"')v=v.slice(1,-1);return v};
function loadMonetag(zone){
  if(!zone||_mtLoaded===zone)return;_mtLoaded=zone;
  const sc=document.createElement('script');sc.src='https://libtl.com/sdk.js';sc.dataset.zone=zone;sc.dataset.sdk='show_'+zone;sc.async=true;
  document.head.appendChild(sc)}
async function refresh(){
  me=await api('me');
  AD.provider=adVal(me.ad_provider).toLowerCase()||'none';AD.block=adVal(me.ad_block_id);
  if(AD.provider==='monetag')loadMonetag(AD.block);
  prepGear();renderMenu()}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}

// ---------- menu ----------
function renderMenu(){
  const e=me.energy,w=me.wallet;
  $('en').textContent='⚡ '+e.energy+'/'+e.cap;
  $('byv').textContent=(+w.pxn).toFixed(4);$('bc').textContent='💵 '+w.cash;$('bb').textContent='💠 '+w.blue;
  $('adb').textContent='📺 Watch ad (+1 ⚡) · '+e.ads_left+' left';$('adb').disabled=e.ads_left<=0;
  nextAt=e.next_in_seconds!=null?Date.now()+e.next_in_seconds*1000:0;
}
setInterval(()=>{
  if(!me||st)return;const e=me.energy;
  if(!nextAt||e.energy>=e.cap){$('nx').textContent='';return}
  const s=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
  $('nx').textContent='+1 in '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  if(s===0&&!busy){busy=1;refresh().catch(()=>{}).finally(()=>busy=0)}
},1000);
function showMenu(){playing=false;syncMusic();document.body.className='';$('over').style.display='none';$('panel').style.display='none';$('menu').style.display='flex'}
function panel(html){$('pc').dataset.v='';$('pc').innerHTML=html+'<button id="px">Close</button>';$('px').onclick=()=>$('panel').style.display='none';$('panel').style.display='flex'}

$('pl').onclick=async()=>{
  $('pl').disabled=true;
  try{R=await api('start_round');me.energy.energy=R.energy_left;begin(R.seed,R.loadout)}catch(e){toast(msg(e))}
  $('pl').disabled=false;
};
$('adb').onclick=async()=>{
  const prov=AD.provider;
  if(!prov||prov==='none'||!AD.block)return toast('Ads not available');
  const hasMt=prov==='monetag'&&typeof window['show_'+AD.block]==='function';
  const hasAg=!!(window.Adsgram&&AD.block);
  if(!hasMt&&!hasAg)return toast('Ads not available');
  let s;try{s=await api('ad_start',{network:hasMt?'monetag':'adsgram'})}catch(e){return toast(msg(e))}
  try{
    if(hasMt) await window['show_'+AD.block]({ ymid: s.session });  // <--- Yahan s.session pass kiya hai
    else await window.Adsgram.init({blockId:AD.block}).show();      // Adsgram
  }catch(e){return toast('Ad was not completed')}
  const before=me.energy.energy;
  for(let i=0;i<6;i++){await sleep(1500);await refresh().catch(()=>{});if(me.energy.energy>before)return toast('+1 ⚡')}
  toast('Energy will arrive in a moment');
};

function tonFriendly(raw,bounce){
  const m=/^(-?\d+):([0-9a-fA-F]{64})$/.exec(String(raw||'').trim());if(!m)return String(raw||'').trim();
  const b=new Uint8Array(36);b[0]=bounce?0x11:0x51;b[1]=parseInt(m[1],10)&255;
  for(let i=0;i<32;i++)b[2+i]=parseInt(m[2].substr(i*2,2),16);
  let c=0;for(let i=0;i<34;i++){c^=b[i]<<8;for(let j=0;j<8;j++)c=(c&0x8000)?(((c<<1)^0x1021)&0xffff):((c<<1)&0xffff)}
  b[34]=c>>8;b[35]=c&255;let s='';for(const x of b)s+=String.fromCharCode(x);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_')}
const TC_MANIFEST='https://sabershaik77.github.io/Drill-Earn/tonconnect-manifest.json'; // <-- apna URL
let _tc=null;
function tcInit(){
  if(!window.TON_CONNECT_UI)return null;
  if(!_tc){_tc=new TON_CONNECT_UI.TonConnectUI({manifestUrl:TC_MANIFEST});
    _tc.onStatusChange(w=>{const el=$('wt');if(!el||!w||!w.account)return;
      const fa=tonFriendly(w.account.address);el.value=fa;
      const ta=$('tc-addr');if(ta)ta.textContent='✓ Connected: '+fa.slice(0,6)+'…'+fa.slice(-4)})}
  return _tc;
}
// ================= WITHDRAW & HISTORY UI =================

function renderWithdrawForm() {
  const t=me.token,w=me.wallet;
  const saved=me.player&&me.player.ton_wallet||'';
  
  panel(
    '<h3>Withdraw '+esc(t.symbol)+'</h3>'+
    '<p>Balance: '+(+w.pxn).toFixed(4)+' '+esc(t.symbol)+'. Requests are reviewed by hand.</p>'+
    '<input id="wa" type="number" inputmode="decimal" placeholder="Amount">'+
    '<button class="big" id="tc-btn">🔗 Connect TON Wallet</button>'+
    '<div id="tc-addr" style="font-size:12px;opacity:.7;text-align:center;margin:-4px 0 8px"></div>'+
    '<p style="text-align:center;opacity:.6;font-size:12px;margin:2px 0">— or paste address —</p>'+
    '<input id="wt" placeholder="TON address (EQ… / UQ…)" value="'+esc(tonFriendly(saved))+'">'+
    '<button class="big" id="wg">Request withdrawal</button>'+
    '<button id="wh-btn" style="background:none; border:none; color:var(--gold); text-decoration:underline; padding:10px; font-size:13px; cursor:pointer;">📜 View Transaction History</button>'
  );

  // TON Connect button logic
  $('tc-btn').onclick=async()=>{
    const tc=tcInit();
    if(!tc)return toast('Wallet connect not available');
    try{
      if(!tc.connected){await tc.openModal()}
      const addr=tc.account&&tonFriendly(tc.account.address);
      if(addr){
        $('wt').value=addr;
        $('tc-addr').textContent='✓ Connected: '+addr.slice(0,6)+'…'+addr.slice(-4);
        $('tc-btn').textContent='✓ Wallet connected';
      } else { toast('No address from wallet') }
    }catch(e){toast('Connect failed')}
  };

  try{
    const tc=tcInit();
    if(tc&&tc.connected&&tc.account&&tc.account.address){
      const fa=tonFriendly(tc.account.address);$('wt').value=fa;
      $('tc-addr').textContent='✓ Connected: '+fa.slice(0,6)+'…'+fa.slice(-4);
      $('tc-btn').textContent='✓ Wallet connected';
    }
  }catch(e){}

  // Request Withdrawal
  $('wg').onclick=async()=>{
    const a=+$('wa').value,ad=tonFriendly($('wt').value.trim());
    if(!(a>0))return toast('Enter amount');
    if(!/^(EQ|UQ)[A-Za-z0-9_-]{46}$/.test(ad))return toast('Enter a valid TON address');
    try{
      await api('withdraw',{pxn:a,address:ad});
      await refresh();
      toast('Request sent');
      $('panel').style.display='none';
    }catch(e){toast(msg(e))}
  };

  // History Button
  $('wh-btn').onclick = renderWithdrawHistory;
}

function renderWithdrawHistory() {
  const t=me.token;
  
  const L=(me.withdrawals||[]).map(x=>{
    let extra = '';
    if (x.status === 'paid' && x.tx_hash) {
      extra = '<a href="https://tonviewer.com/transaction/'+esc(x.tx_hash)+'" target="_blank" style="color:var(--grn);text-decoration:none;font-weight:bold">🔗 View Tx</a>';
    } else if (x.reject_reason) {
      extra = '<span style="color:#e0584a">'+esc(x.reject_reason)+'</span>';
    }
    const date = new Date(x.created_at).toLocaleDateString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    
    return '<div style="display:flex; flex-direction:column; gap:4px; background:var(--soil2); padding:10px; margin-bottom:6px; border-radius:4px;">'+
             '<div style="display:flex; justify-content:space-between; font-weight:bold;">'+
               '<span>'+(+x.pxn_amount)+' '+esc(t.symbol)+'</span>'+
               '<span style="text-transform:uppercase; font-size:11px; color:'+(x.status==='paid'?'var(--grn)':x.status==='rejected'?'#e0584a':'var(--gold)')+'">'+esc(x.status)+'</span>'+
             '</div>'+
             '<div style="font-size:11px; color:#a89a82; display:flex; justify-content:space-between; align-items:center;">'+
               '<span>'+date+'</span>'+
               '<span>'+extra+'</span>'+
             '</div>'+
           '</div>';
  }).join('');

  panel(
    '<h3>Transaction History</h3>'+
    '<div class="list" style="max-height:350px; overflow-y:auto; margin-bottom:10px;">'+
      (L||'<p class="mut">No transactions yet.</p>')+
    '</div>'+
    '<button class="big" onclick="renderWithdrawForm()">Back to Withdraw</button>'
  );
}

$('wd').onclick=renderWithdrawForm;
const PZ_LBL={pxn:'PXN',cash:'💵 Cash',blue:'💠 Sky',drill:'⛏ Drill',attachment:'🔧 Attachment'};
const PZ_ICO={pxn:'🪙',cash:'💵',blue:'💠',drill:'⛏',attachment:'🔧'};
function prizeHtml(prizes){
  if(!Array.isArray(prizes)||!prizes.length)return '';
  const by={};prizes.forEach(p=>{if(p&&p.rank)by[p.rank]=p});
  const box=k=>{const p=by[k];
    if(!p)return '<div class="pz r'+k+'"><div class="ph">–</div><b>#'+k+'</b><small>No prize</small></div>';
    const u=String(p.image_url||'').trim(),ty=String(p.type||'');
    const img=/^https?:\/\//i.test(u)?'<img src="'+esc(u)+'" alt="" onerror="this.outerHTML=\'<div class=ph>'+(PZ_ICO[ty]||'🎁')+'</div>\'">':'<div class="ph">'+(PZ_ICO[ty]||'🎁')+'</div>';
    return '<div class="pz r'+k+'">'+img+'<b>#'+k+'</b><small>'+esc(PZ_LBL[ty]||ty)+'</small><small>×'+esc(p.amount)+'</small></div>'};
  return '<h3>🏆 Season Prizes</h3><div class="pzg">'+box(1)+box(2)+box(3)+'</div>';
}
$('lb').onclick=async()=>{
  try{const r=await api('leaderboard');
    const top=r.top||[];
    panel('<div id="lbw">'+prizeHtml(r.prizes)+'<h3>Top players</h3><div class="list">'+(top.length?top.map(x=>'<div><span>'+x.rank+'. '+esc(x.username||x.first_name||'Player')+'</span><span>'+x.score+'</span></div>').join(''):'<p>No scores yet this season.</p>')+'</div></div>');
  }catch(e){toast(msg(e))}
};
$('ob').onclick=()=>{showMenu();refresh().catch(()=>{})};


// ================= INVENTORY & EQUIPMENT =================
const SLOTS=[['front','Front'],['side','Side'],['back','Back']];
const IMG=new Map();
function gimg(u){u=String(u||'').trim();if(!/^https?:\/\//i.test(u))return null;
  let e=IMG.get(u);
  if(!e){e={im:new Image(),ok:false};e.im.onload=()=>{e.ok=true};e.im.onerror=()=>{e.bad=1};e.im.src=u;IMG.set(u,e)}
  return e.ok?e.im:null}
let INV={drills:[],attachments:[],pd:[],pa:[],tab:'drills'};
async function loadInv(){
  const j=await api('get_inventory');
  INV.drills=j.drills||[];INV.attachments=j.attachments||[];INV.pd=j.player_drills||[];INV.pa=j.player_attachments||[];
  [].concat(INV.drills,INV.attachments).forEach(x=>gimg(x.image_url));
}
function prepGear(){if(!me)return;gimg(me.equipped_drill&&me.equipped_drill.image_url);(me.equipped_attachments||[]).forEach(a=>gimg(a.image_url))}
const pct=v=>(v>0?'+':'')+Math.round(v*100)+'%';
function statTxt(o){
  const t=[],sm=+o.speed_mult||1,hp=+o.hp_bonus||0,dr=+o.damage_reduction||0;
  if(Math.abs(sm-1)>.0001)t.push('⚡ '+pct(sm-1)+' Speed');
  if(hp)t.push('❤ '+(hp>0?'+':'')+hp+' HP');
  if(dr>0)t.push('🛡 '+Math.round(dr*100)+'% less stone dmg');
  return t.length?t.join(' · '):'No bonus'}
function itemRow(o,eq,ico,btn,extra){
  const u=String(o.image_url||'').trim();
  const im=/^https?:\/\//i.test(u)?'<img src="'+esc(u)+'" alt="" onerror="this.outerHTML=\'<div class=ph>'+ico+'</div>\'">':'<div class="ph">'+ico+'</div>';

function renderInventory(){

const W=640,S=6,WS=3840,N_ITEMS=4200;
function mb(a){return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function genLayout(seed){
  const r=mb(seed);
  const start={x:400+r()*(WS-800),y:400+r()*(WS-800),a:r()*6.28},items=[];
  for(let n=0;n<N_ITEMS;n++){
    const x=40+r()*(WS-80),y=40+r()*(WS-80),q=r(),rot=r()*6;
    if(Math.hypot(x-start.x,y-start.y)<90)continue;
    items.push({i:n,x,y,rot,t:q<.02?'pxn':q<.12?'score':q<.32?'cash':q<.52?'sky':'stone'});
  }
  return{start,items};
}

function begin(seed,lo){
  lo=lo||{};
  const sm=Number.isFinite(+lo.speed_mult)&&+lo.speed_mult>0?+lo.speed_mult:1,hb=Number.isFinite(+lo.hp_bonus)?Math.trunc(+lo.hp_bonus):0,dr=Number.isFinite(+lo.damage_reduction)?Math.min(.9,Math.max(0,+lo.damage_reduction)):0;
  GS={spd:BASE_SPEED*sm,maxhp:BASE_HP+hb,dr,dmg:STONE_DMG*(1-dr)};
  GEAR={drill:lo.drill&&lo.drill.image_url||'',att:(lo.attachments||[]).map(a=>({slot:a.slot,url:a.image_url||''}))};
  gimg(GEAR.drill);GEAR.att.forEach(a=>gimg(a.url));
  dug=new Uint8Array(W*W);SEED=seed%1000;
  for(let j=0;j<W;j++)for(let i=0;i<W;i++){
    wx.fillStyle=tones[Math.floor(h(i>>2,j>>2)*4)];
    if(h(i,j)>.85)wx.fillStyle=tones[2];
    wx.fillRect(i,j,1,1);
  }
  const L=genLayout(seed);
  P={x:L.start.x,y:L.start.y,a:L.start.a,roll:0,hp:GS.maxhp,maxhp:GS.maxhp,score:0,cash:0,sky:0,pxn:0,shake:0};
  items=L.items;fx=[];txt=[];ev=[];gt=0;
  dig();upd();
  document.body.className='play';$('menu').style.display='none';$('over').style.display='none';st=1;playing=true;syncMusic();
}
function dig(){
  const cx=Math.floor(P.x/S),cy=Math.floor(P.y/S),r=4;
  wx.fillStyle='#2a2218';
  for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){
    if(i*i+j*j>r*r)continue;
    const a=cx+i,b=cy+j;if(a<0||b<0||a>=W||b>=W||dug[b*W+a])continue;
    dug[b*W+a]=1;wx.fillRect(a,b,1,1);
    if(rnd()<.12)fx.push({x:a*S,y:b*S,vx:(rnd()-.5)*60,vy:(rnd()-.5)*60,l:.5,c:'#b8aa9a'});
  }
}
function upd(){
  $('hpf').style.width=Math.max(0,P.hp/P.maxhp*100)+'%';
  $('sc').textContent='Score '+P.score;$('cs').textContent='💵'+P.cash;$('sk').textContent='💠'+P.sky;$('gdv').textContent=P.pxn;
}
function pop(x,y,s,c){txt.push({x,y,s,c,l:1})}
function burst(x,y,c,n){for(let i=0;i<n;i++)fx.push({x,y,vx:(rnd()-.5)*200,vy:(rnd()-.5)*200,l:.6,c})}
async function sub(){
  $('rb').style.display='none';$('fin').textContent='Checking your round…';$('over').style.display='flex';
  try{

    $('fin').textContent=r.ok?'Score '+r.score+' | 💵'+r.cash+' | 💠'+r.blue+' | PXN '+r.pxn:'This round could not be verified. No reward was given.';

}

let SND=true;try{SND=localStorage.getItem('snd')!=='0'}catch(e){}
let AC=null,master=null,mg=null,musicOn=false,musicTimer=null,nextT=0,mstep=0,playing=false;
function ac(){
  if(!AC){const Cx=window.AudioContext||window.webkitAudioContext;if(!Cx)return null;
    AC=new Cx();master=AC.createGain();master.gain.value=1;master.connect(AC.destination);
    mg=AC.createGain();mg.gain.value=.10;mg.connect(master)}
  if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,dur,type,vol,f2,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.03)}
function noise(t,dur,vol,fq,q){const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q||1;
  const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t)}
const SFX={
  click(t){noise(t,.03,.22,3200,.8);tone(170,t,.045,'square',.04,85)},           // keyboard key press
  pxn(t){tone(1318,t,.12,'triangle',.16);tone(1760,t+.07,.24,'triangle',.16)},    // coin ding
  cash(t){tone(988,t,.07,'square',.05);tone(1319,t+.06,.15,'square',.05)},       // cha-ching
  sky(t){[1568,1976,2349,3136].forEach((f,i)=>tone(f,t+i*.05,.2,'sine',.11))},    // glassy sparkle
  score(t){tone(660,t,.09,'sine',.13,880)},                                       // blip
  stone(t){noise(t,.25,.45,300,.7);tone(140,t,.25,'sawtooth',.16,45)},           // thud
  over(t){[392,330,262,196].forEach((f,i)=>tone(f,t+i*.14,.3,'triangle',.14))}   // game over
};
function snd(n){try{if(!SND)return;if(!ac())return;SFX[n](AC.currentTime)}catch(e){}}
const BASS=[55,65.41,49,82.41],PAT=[0,2,4,2,1,3,5,3,0,2,4,7,5,3,2,1],SC=[0,3,5,7,10];
const nf=i=>110*Math.pow(2,(SC[i%5]+12*Math.floor(i/5))/12);
function musicTick(){if(!musicOn||!AC)return;
  while(nextT<AC.currentTime+.4){
    tone(nf(PAT[mstep%16]+5),nextT,.38,'triangle',.4,0,mg);
    if(mstep%8===0)tone(BASS[(mstep>>3)%4],nextT,2,'sine',.6,0,mg);
    nextT+=.28;mstep++}}
function syncMusic(){try{
  if(SND&&playing&&ac()){if(!musicOn){musicOn=true;nextT=AC.currentTime+.1;musicTimer=setInterval(musicTick,100)}}
  else{musicOn=false;clearInterval(musicTimer)}}catch(e){}}

let jx=0,jy=0;const base=$('base'),knob=$('knob');let act=false;
function jm(e){const b=base.getBoundingClientRect();let dx=e.clientX-(b.left+70),dy=e.clientY-(b.top+70);const d=Math.hypot(dx,dy),m=60;
  if(d>m){dx*=m/d;dy*=m/d}jx=dx/m;jy=dy/m;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
base.onpointerdown=e=>{act=true;base.setPointerCapture(e.pointerId);jm(e)};
base.onpointermove=e=>{if(act)jm(e)};
base.onpointerup=base.onpointercancel=()=>{act=false;jx=jy=0;knob.style.transform=''};
const K={};onkeydown=e=>K[e.key.toLowerCase()]=1;onkeyup=e=>K[e.key.toLowerCase()]=0;

// loop
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(st){
    let ix=jx,iy=jy;
    if(K.a||K.arrowleft)ix=-1;if(K.d||K.arrowright)ix=1;if(K.w||K.arrowup)iy=-1;if(K.s||K.arrowdown)iy=1;
    const m=Math.min(1,Math.hypot(ix,iy));
    if(m>.1){const a=Math.atan2(iy,ix);let da=a-P.a;da=Math.atan2(Math.sin(da),Math.cos(da));P.a+=da*Math.min(1,dt*8)}
    const nx=P.x+Math.cos(P.a)*GS.spd*dt,ny=P.y+Math.sin(P.a)*GS.spd*dt;
    if(nx<30||nx>WS-30||ny<30||ny>WS-30){P.a+=Math.PI*.75}else{P.x=nx;P.y=ny}
    gt+=dt*1000;P.roll+=10*dt;dig();
    for(const it of items){if(it.d)continue;
      if(Math.abs(it.x-P.x)>30||Math.abs(it.y-P.y)>30)continue;
      if(Math.hypot(it.x-P.x,it.y-P.y)<26){it.d=1;ev.push({i:it.i,t:Math.round(gt)});
        if(it.t=='stone'){P.hp-=GS.dmg;P.shake=.3;burst(it.x,it.y,'#d9622b',14);pop(it.x,it.y,'-'+(+GS.dmg.toFixed(1))+' HP','#ff6a5a');snd('stone')}
        else if(it.t=='cash'){P.cash+=1;burst(it.x,it.y,'#7dd35a',10);pop(it.x,it.y,'+1','#f6c98f');snd('cash')}
        else if(it.t=='score'){P.score+=5;burst(it.x,it.y,'#fff',10);pop(it.x,it.y,'+5','#fff');snd('score')}
        else if(it.t=='sky'){P.sky+=1;burst(it.x,it.y,'#5fd4ff',12);pop(it.x,it.y,'+1','#7fe3ff');snd('sky')}
        else{P.pxn+=1;burst(it.x,it.y,'#ffe14a',20);pop(it.x,it.y,'+1','#ffe14a');snd('pxn')}
        upd();
        if(P.hp<=0){st=0;playing=false;syncMusic();snd('over');sub();break}   // stop at death: no pickups after the last stone
      }}
    P.shake=Math.max(0,P.shake-dt);
  }
  for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}fx=fx.filter(f=>f.l>0);
  for(const f of txt){f.y-=30*dt;f.l-=dt}txt=txt.filter(f=>f.l>0);
  if(items.length){try{draw(t/1000)}catch(e){console.error(e)}}
  requestAnimationFrame(loop);
}
function tri(x,y,r,rot,c){X.fillStyle=c;X.beginPath();for(let k=0;k<3;k++){const a=rot+k*2.1;X.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}X.fill()}
function diamond(x,y,r,c,c2){X.fillStyle=c;X.beginPath();X.moveTo(x,y-r);X.lineTo(x+r*.8,y);X.lineTo(x,y+r);X.lineTo(x-r*.8,y);X.fill();X.fillStyle=c2;X.fillRect(x-2,y-r*.5,3,3)}
// Attachments are drawn in drill-local space (+x = tip, +y = right side). Images should face right like the drill.
const GEAR_POS={front:{x:27,y:0,s:26},side:{x:0,y:19,s:22},back:{x:-25,y:0,s:24}},GEAR_COL={front:'#ff9d2e',side:'#9aa7b4',back:'#c0504d'};
function drawGear(){
  for(const a of GEAR.att){
    const g=GEAR_POS[a.slot];if(!g)continue;
    const im=gimg(a.url),sides=a.slot==='side'?[1,-1]:[1];
    for(const m of sides){
      X.save();X.translate(g.x,g.y*m);if(m<0)X.scale(1,-1);
      
      // --- NAYA ROTATION LOGIC ---
      if (a.slot === 'front') X.rotate(Math.PI / 2); // Front ko 90 degree Right ghumaya
      if (a.slot === 'back') X.rotate(Math.PI / 2);  // Back ko 90 degree Right ghumaya
      
      if(im){X.imageSmoothingEnabled=true;X.drawImage(im,-g.s/2,-g.s/2,g.s,g.s);X.imageSmoothingEnabled=false}
      else{X.fillStyle=GEAR_COL[a.slot];X.fillRect(-g.s/4,-g.s/4,g.s/2,g.s/2);X.fillStyle='rgba(0,0,0,.35)';X.fillRect(-g.s/4,-g.s/4,g.s/2,3)}
      X.restore()}}}
function draw(t){
  X.fillStyle='#000';X.fillRect(0,0,vw,vh);
  const sx=vw/2,sy=vh*.42,sh=P.shake?(rnd()-.5)*6:0;
  X.save();X.translate(sx-P.x+sh,sy-P.y+sh);
  {const x0=Math.max(0,Math.floor((P.x-sx)/S)),y0=Math.max(0,Math.floor((P.y-sy)/S)),x1=Math.min(W,Math.ceil((P.x+vw-sx)/S)),y1=Math.min(W,Math.ceil((P.y+vh-sy)/S));X.drawImage(wc,x0,y0,x1-x0,y1-y0,x0*S,y0*S,(x1-x0)*S,(y1-y0)*S)}
  for(const it of items){if(it.d)continue;
    if(Math.abs(it.x-P.x)>150||Math.abs(it.y-P.y)>150)continue;
    const{x,y}=it;
    if(it.t=='stone')tri(x,y,15,it.rot,'#d9622b');
    else if(it.t=='cash'){X.fillStyle='#4aa83a';X.fillRect(x-12,y-7,24,14);X.fillStyle='#bff0a0';X.fillRect(x-3,y-3,6,6)}
    else if(it.t=='score'){X.fillStyle='#fff';X.fillRect(x-3,y-9,6,18);X.fillRect(x-9,y-3,18,6)}
    else if(it.t=='sky')diamond(x,y,14,'#4fc8ff','#e6fbff');
    else{const pp=1+Math.sin(t*5)*.08,rr=15*pp;
      if(pxnIcon){X.drawImage(pxnIcon,Math.round(x-PXN_SZ/2),Math.round(y-PXN_SZ/2))}
      else{X.fillStyle='#ffd21a';X.beginPath();X.arc(x,y,rr*.8,0,6.283);X.fill();X.fillStyle='#fff3a0';X.fillRect(x-2,y-6,4,4)}}
  }
  for(const f of fx){X.fillStyle=f.c;X.fillRect(f.x,f.y,4,4)}
  X.save();X.translate(P.x,P.y);X.rotate(P.a);
  const di=gimg(GEAR.drill);
  if(di){X.imageSmoothingEnabled=true;X.drawImage(di,-DRILL_SZ/2,-DRILL_SZ/2,DRILL_SZ,DRILL_SZ);X.imageSmoothingEnabled=false}   // custom drill image: tip points right (+x)
  else{
    X.fillStyle='#e0b48a';X.beginPath();X.moveTo(22,0);X.lineTo(8,-8);X.lineTo(8,8);X.fill();
    X.fillStyle='#b88a62';X.fillRect(12,-1,6,2);
    X.save();X.rotate(P.roll-P.a);
    X.fillStyle='#4fc22c';for(let k=0;k<8;k++){const a=k*Math.PI/4;X.fillRect(Math.cos(a)*11-3,Math.sin(a)*11-3,6,6)}
    X.fillRect(-9,-9,18,18);X.fillStyle='#2c7a16';X.fillRect(-5,-5,10,10);X.fillStyle='#103d08';X.fillRect(-2,-2,4,4);
    X.restore();
  }
  drawGear();
  X.restore();
  for(const f of txt){X.globalAlpha=Math.max(0,f.l);X.fillStyle=f.c;X.font='bold 14px monospace';X.fillText(f.s,f.x-14,f.y-14)}
  X.globalAlpha=1;X.restore();
  const g=X.createRadialGradient(sx,sy,45,sx,sy,125);   // fog of war
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');
  X.fillStyle=g;X.fillRect(0,0,vw,vh);
}
